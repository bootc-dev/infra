name: DCO Signoff Command

on:
  issue_comment:
    types: [created]

# Only run on PR comments that start with /signoff
jobs:
  signoff:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/signoff')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_AW_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Check commenter permissions
        id: check-permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Get the user's permission level
          PERMISSION=$(gh api \
            "/repos/$REPO/collaborators/$COMMENTER/permission" \
            --jq '.permission')

          echo "User $COMMENTER has permission: $PERMISSION"

          # Check if user has triage or higher (triage, write, maintain, admin)
          case "$PERMISSION" in
            admin|maintain|write|triage)
              echo "authorized=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "authorized=false" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Post unauthorized message
        if: steps.check-permissions.outputs.authorized != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          gh pr comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "❌ @$COMMENTER does not have sufficient permissions to use /signoff (requires triage role or higher)"
          exit 1

      - name: Checkout repository
        if: steps.check-permissions.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Get PR details and add signoff
        if: steps.check-permissions.outputs.authorized == 'true'
        id: signoff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          # Get PR details
          PR_DATA=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefName,headRefOid)
          BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          EXPECTED_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')

          echo "Branch: $BRANCH"
          echo "Expected SHA: $EXPECTED_SHA"

          # Checkout the PR branch
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          # Verify tip commit matches expected SHA
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "sha_mismatch=true" >> $GITHUB_OUTPUT
            echo "expected_sha=$EXPECTED_SHA" >> $GITHUB_OUTPUT
            echo "actual_sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Get commenter's email from GitHub API
          COMMENTER_DATA=$(gh api "/users/$COMMENTER")
          COMMENTER_NAME=$(echo "$COMMENTER_DATA" | jq -r '.name // .login')
          COMMENTER_EMAIL=$(echo "$COMMENTER_DATA" | jq -r '.email // empty')

          # If no public email, use the noreply address
          if [ -z "$COMMENTER_EMAIL" ] || [ "$COMMENTER_EMAIL" = "null" ]; then
            COMMENTER_ID=$(echo "$COMMENTER_DATA" | jq -r '.id')
            COMMENTER_EMAIL="${COMMENTER_ID}+${COMMENTER}@users.noreply.github.com"
          fi

          echo "Signing off as: $COMMENTER_NAME <$COMMENTER_EMAIL>"

          # Get current commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)

          # Check if signoff already exists
          SIGNOFF_LINE="Signed-off-by: $COMMENTER_NAME <$COMMENTER_EMAIL>"
          if echo "$COMMIT_MSG" | grep -qF "$SIGNOFF_LINE"; then
            echo "already_signed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Amend the commit with signoff
          git config user.name "$COMMENTER_NAME"
          git config user.email "$COMMENTER_EMAIL"

          # Add signoff to commit message
          NEW_COMMIT_MSG="${COMMIT_MSG}

          $SIGNOFF_LINE"

          git commit --amend -m "$NEW_COMMIT_MSG"

          # Force push
          git push --force-with-lease origin "$BRANCH"

          echo "signed_off=true" >> $GITHUB_OUTPUT

      - name: Post SHA mismatch message
        if: |
          steps.check-permissions.outputs.authorized == 'true' &&
          steps.signoff.outputs.sha_mismatch == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_SHA: ${{ steps.signoff.outputs.expected_sha }}
          ACTUAL_SHA: ${{ steps.signoff.outputs.actual_sha }}
        run: |
          gh pr comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "❌ Cannot add signoff: the tip commit has changed.
            Expected: \`$EXPECTED_SHA\`
            Actual: \`$ACTUAL_SHA\`

            Please try again with the current commit."

      - name: Post already signed message
        if: |
          steps.check-permissions.outputs.authorized == 'true' &&
          steps.signoff.outputs.already_signed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "✅ This commit is already signed off by you."

      - name: Post success message
        if: |
          steps.check-permissions.outputs.authorized == 'true' &&
          steps.signoff.outputs.signed_off == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "✅ DCO signoff added successfully."
